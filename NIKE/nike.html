<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nike-Inspired Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        /* Global Styles */
        body {
            background-color: #fff;
            color: #111;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            background: #fff;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .nav-link {
            font-size: 1.1rem;
            font-weight: bold;
            color: #111 !important;
        }
        .nav-link:hover {
            color: #f00 !important;
        }

        /* Hero Section */
        .hero {
            background: url('images/nike-banner.jpg') no-repeat center center/cover;
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
        }
        .hero h1 {
            font-size: 4rem;
        }
        .hero p {
            font-size: 1.5rem;
        }
        .shop-btn {
            background: #f00;
            color: #fff;
            padding: 15px 30px;
            font-size: 1.2rem;
            text-decoration: none;
            border-radius: 30px;
            transition: 0.3s ease-in-out;
        }
        .shop-btn:hover {
            background: #111;
            color: #fff;
        }

        /* Featured Products */
        .featured-products {
            text-align: center;
            padding: 50px 0;
        }
        .featured-products h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .product-card {
            transition: 0.3s;
            border-radius: 15px;
            overflow: hidden;
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: auto;
            border-radius: 15px;
        }
        .product-card:hover {
            transform: scale(1.05);
        }
        .product-name {
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 10px;
        }
        .product-price {
            color: #f00;
            font-size: 1.2rem;
        }

        /* Carousel */
        .carousel-container {
            width: 80%; /* Adjusted container width */
            margin: auto;
        }

        .carousel-item img {
            width: 100%;
            height: 300px; /* Reduced image size */
            object-fit: cover;
            border-radius: 15px;
        }

        .carousel-caption {
            background: rgba(0, 0, 0, 0.6); /* Slightly darker background */
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1.2rem;
            opacity: 0;
            transition: 0.3s ease;
        }

        .carousel-item:hover .carousel-caption {
            opacity: 1;
        }

        /* Footer */
        .footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">NIKE</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Men</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Women</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Kids</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Sale</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<section class="hero">
    <div>
        <h1>Move with Style</h1>
        <p>Find the perfect fit for every moment</p>
        <a href="#" class="shop-btn">Shop Now</a>
    </div>
</section>

<!-- Featured Products -->
<section class="featured-products">
    <h2>🔥 Trending Now</h2>
    <div class="container">
        <div class="row">
            <div class="col-md-4">
                <div class="product-card">
                    <img src="images/shopping.webp" alt="Nike Shoe">
                    <p class="product-name">Nike Air Max</p>
                    <p class="product-price">$150</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="product-card">
                    <img src="images/shopping (22).webp" alt="Nike Shoe">
                    <p class="product-name">Nike ZoomX</p>
                    <p class="product-price">$180</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="product-card">
                    <img src="images/shopping (33).webp" alt="Nike Shoe">
                    <p class="product-name">Nike React</p>
                    <p class="product-price">$130</p>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Product Carousel -->
<div class="carousel-container">
    <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/shopping (c1).webp" alt="Shoe 1">
                <div class="carousel-caption">Nike Air Max</div>
            </div>
            <div class="carousel-item">
                <img src="images/shopping (c2).webp" alt="Shoe 2">
                <div class="carousel-caption">Nike ZoomX</div>
            </div>
            <div class="carousel-item">
                <img src="images/shopping (c3).webp" alt="Shoe 3">
                <div class="carousel-caption">Nike React</div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <p>© 2025 NIKE - All Rights Reserved</p>
</div>

</body>
</html>
