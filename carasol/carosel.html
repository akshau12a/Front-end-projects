<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Awesome Bootstrap Carousel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .carousel-container {
            width: 50%;
            max-width: 800px;
        }

        .carousel-item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .carousel-caption {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .carousel-item:hover .carousel-caption {
            opacity: 1;
        }

        .carousel-indicators [data-bs-target] {
            background-color: #fff;
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: invert(100%);
        }

    </style>
</head>
<body>

<div class="carousel-container">
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="3"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="4"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="5"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="6"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="7"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="8"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="9"></button>
        </div>

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/earth.png" class="d-block w-100" alt="Earth">
                <div class="carousel-caption">🌍 Earth: The Blue Planet</div>
            </div>
            <div class="carousel-item">
                <img src="images/jupiter.png" class="d-block w-100" alt="Jupiter">
                <div class="carousel-caption">🪐 Jupiter: The Gas Giant</div>
            </div>
            <div class="carousel-item">
                <img src="images/mars.png" class="d-block w-100" alt="Mars">
                <div class="carousel-caption">🔥 Mars: The Red Planet</div>
            </div>
            <div class="carousel-item">
                <img src="images/mercury.png" class="d-block w-100" alt="Mercury">
                <div class="carousel-caption">☀ Mercury: Closest to the Sun</div>
            </div>
            <div class="carousel-item">
                <img src="images/neptune.png" class="d-block w-100" alt="Neptune">
                <div class="carousel-caption">🌊 Neptune: The Ice Giant</div>
            </div>
            <div class="carousel-item">
                <img src="images/saturn.png" class="d-block w-100" alt="Saturn">
                <div class="carousel-caption">💍 Saturn: The Ringed Beauty</div>
            </div>
            <div class="carousel-item">
                <img src="images/sun.png" class="d-block w-100" alt="Sun">
                <div class="carousel-caption">☀ Sun: The Ultimate Energy Source</div>
            </div>
            <div class="carousel-item">
                <img src="images/uranus.png" class="d-block w-100" alt="Uranus">
                <div class="carousel-caption">🌀 Uranus: The Mysterious Ice Giant</div>
            </div>
            <div class="carousel-item">
                <img src="images/venus.png" class="d-block w-100" alt="Venus">
                <div class="carousel-caption">🔥 Venus: The Hottest Planet</div>
            </div>
            <div class="carousel-item">
                <img src="images/pluto.png" class="d-block w-100" alt="Pluto">
                <div class="carousel-caption">❄️ Pluto: The Dwarf Planet</div>
            </div>
        </div>
        
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
